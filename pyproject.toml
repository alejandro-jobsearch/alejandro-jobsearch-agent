[project]
name = "jobagent"
version = "0.1.0"
description = "Agentic job-search pipeline: sourcing, ATS scoring and GitHub tracking"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.8",
    "langgraph>=1.2",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-jobspy>=1.3",
    "rapidfuzz>=3",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
