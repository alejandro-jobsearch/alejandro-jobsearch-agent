# Search config example. Copy to the private data repo as config/search.yml and adapt.

jobspy:
  sites: [linkedin, indeed, google]
  hours_old: 24          # daily cron → last 24h only
  per_term: 25
  sleep: 4               # seconds between queries (LinkedIn rate-limits ~10 pages/IP)
  locations:
    - {name: "Lima, Peru", remote: false, country_indeed: peru}
    - {name: "Latin America", remote: true, country_indeed: peru}
  terms:
    - Head of AI
    - Enterprise Architect
    - AI Architect
    - Gerente de Tecnología

# Public ATS boards (no auth). provider: greenhouse | lever | ashby
boards:
  - {provider: greenhouse, slug: anthropic, company: Anthropic}
  - {provider: ashby, slug: openai, company: OpenAI}

# Optional: public remote boards. utc_offset drops Himalayas postings limited to other time zones.
remote_boards:
  sources: [himalayas, weworkremotely, getonboard]
  country: Peru
  country_pattern: 'per[uú]'
  utc_offset: -5
  max_age_days: 14
  terms: [AI Architect, Head of AI]

prefilter:
  title_include:
    - '\b(head|director|gerente|subgerente|jefe|manager|lead|principal|architect|arquitect)'
  title_exclude:
    - '\b(junior|jr\.?|trainee|intern|practicante|analista|analyst|developer|desarrollador|qa|support|soporte)\b'
  geo_block: []   # locations dropped even if geo_keep matches (mis-geocoded places)
  geo_keep:
    - 'peru|perú|lima'
    - 'latam|latin america|south america|americas'
  geo_local: ['peru|perú|lima', 'latam|latin america']   # eligibility_drop never applies to these locations
  eligibility_drop:                                      # remote roles that only hire elsewhere
    - 'authorized to work in the (u\.s\.|usa|united states|uk|eu)'
  job_type_exclude: [temporary, internship, parttime]   # JobSpy job_type
  company_exclude:                                       # company-name blocklist (regex)
    - 'some staffing firm'
  geo_drop:
    - '.'   # anything else with a location is dropped; empty location is kept

# Optional: drop small/regional IT-services consultancies using the LinkedIn company page (size, industry, HQ).
company_filter:
  industries: 'IT Services|IT Consulting|Staffing|Outsourcing'
  countries: [PE, CO, MX]       # HQ countries considered "local"
  max_employees: 5000           # local consultancy at or below this size is dropped
  tiny_employees: 200           # any consultancy at or below this size is dropped
  sleep: 1

tracker:
  org: your-org
  project_number: 1
  min_score: 75
  watch_min: 60
  prune_statuses: [Nueva, Evaluada]   # daily: close + archive cards whose posting no longer accepts applications
